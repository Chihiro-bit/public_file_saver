group = "com.example.public_file_saver"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// AGP 9+ with built-in Kotlin (android.builtInKotlin=true, the default) registers the
// `kotlin` extension itself; applying KGP on top of it is deprecated by Flutter.
// Older toolchains (AGP < 9, or AGP 9 with built-in Kotlin disabled) still need KGP.
def usesBuiltInKotlin = project.extensions.findByName("kotlin") != null
if (!usesBuiltInKotlin) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "com.example.public_file_saver"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// `kotlin.compilerOptions` requires KGP 2.0+ (always true with built-in Kotlin);
// fall back to the legacy `android.kotlinOptions` for apps still on KGP 1.x.
if (kotlin.hasProperty("compilerOptions")) {
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }
} else {
    android {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
    }
}
