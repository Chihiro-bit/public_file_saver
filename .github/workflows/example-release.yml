name: Example release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: example-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release example (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: web
            runner: ubuntu-24.04
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
          - platform: ios-unsigned
            runner: macos-15
    defaults:
      run:
        shell: bash
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build and package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$PLATFORM" in
            android)
              flutter build apk --release --split-per-abi
              cp build/app/outputs/flutter-apk/*-release.apk dist/
              ;;
            web)
              flutter build web --release
              tar -czf dist/example-web.tar.gz -C build/web .
              ;;
            linux-x64)
              flutter build linux --release --target-platform linux-x64
              tar -czf dist/example-linux-x64.tar.gz -C build/linux/x64/release/bundle .
              ;;
            windows-x64)
              flutter build windows --release --target-platform windows-x64
              ;;
            macos-arm64)
              flutter build macos --release --config-only
              xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
                -configuration Release -derivedDataPath build/macos \
                ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
              ditto -c -k --sequesterRsrc --keepParent \
                build/macos/Build/Products/Release/*.app dist/example-macos-arm64.zip
              ;;
            ios-unsigned)
              flutter build ios --release --no-codesign
              tar -czf dist/example-ios-unsigned.tar.gz -C build/ios/iphoneos Runner.app
              ;;
          esac

      - name: Package Windows executable and runtime files
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/example-windows-x64.zip

      - name: Add build information
        env:
          PLATFORM: ${{ matrix.platform }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "Platform: $PLATFORM"
            echo "Commit: $COMMIT"
            flutter --version
            echo
            echo 'Android: release mode, signed with the example debug key; for testing only.'
            echo 'Apple: unsigned and not notarized; iOS requires signing before device installation.'
            echo 'Web: serve the extracted files using an HTTP server.'
            echo 'Desktop: extract the entire archive, including all runtime files.'
          } > dist/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: example-release-${{ matrix.platform }}-${{ github.run_number }}
          path: example/dist/
          if-no-files-found: error
          retention-days: 30
